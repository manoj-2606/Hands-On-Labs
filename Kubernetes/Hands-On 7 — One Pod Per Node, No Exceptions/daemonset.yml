apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: daemon-lab
  labels:
    app: log-collector
spec:
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      tolerations:
        - key: "env"
          operator: "Equal"
          value: "production"
          effect: "NoExecute"
      containers:
        - name: app
          image: busybox:1.35
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
