apiVersion: v1
kind: Pod
metadata:
  name: zone-a-pod
  namespace: daemon-lab
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: zone
                operator: In
                values:
                  - "a"
  containers:
    - name: app
      image: busybox:1.35
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
