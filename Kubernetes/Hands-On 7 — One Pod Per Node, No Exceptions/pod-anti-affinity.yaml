apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-app
  namespace: daemon-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spread-app
  template:
    metadata:
      labels:
        app: spread-app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - spread-app
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: app
          image: busybox:1.35
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
