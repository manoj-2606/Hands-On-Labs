apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: ingress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from App A"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: ingress-lab
spec:
  selector:
    app: app-a
  ports:
    - port: 80
      targetPort: 5678
