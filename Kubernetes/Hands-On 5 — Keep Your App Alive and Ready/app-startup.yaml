apiVersion: v1
kind: Pod
metadata:
  name: app-startup
  namespace: team-a
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 20 && touch /tmp/healthy && sleep 3600"]
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      startupProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
        timeoutSeconds: 3
