apiVersion: v1
kind: Pod
metadata:
  name: app-oom
  namespace: team-a
spec:
  containers:
    - name: app
      image: python:3.9-slim
      command: ["python3", "-c", "x = bytearray(50 * 1024 * 1024)"]
      resources:
        requests:
          memory: "5Mi"
          cpu: "100m"
        limits:
          memory: "10Mi"
          cpu: "200m"
