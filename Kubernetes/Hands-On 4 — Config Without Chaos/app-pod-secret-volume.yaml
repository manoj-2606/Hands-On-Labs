apiVersion: v1
kind: Pod
metadata:
  name: app-pod-secret-volume
  namespace: team-a
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: secret-vol
          mountPath: /etc/secrets/
  volumes:
    - name: secret-vol
      secret:
        secretName: app-secret
