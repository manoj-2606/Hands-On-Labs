# ============================================================
# SecretProviderClass — Azure Key Vault CSI Integration
# Tells the CSI driver which Key Vault, which secret,
# and which identity to use for auth.
#
# Flow:
#   Pod starts
#   → CSI driver reads SecretProviderClass
#   → Authenticates to Key Vault via Workload Identity (MI)
#   → Fetches secret value
#   → Mounts as file at /mnt/secrets/db-password inside pod
#   → Pod reads file — secret never stored in K8s
#
# Prerequisites (created in pipeline Provision stage):
#   - Key Vault: kv-gitops-lab16
#   - Secret: db-password
#   - Workload Identity federated credential on AKS
# ============================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets
  namespace: secured-app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "$(workloadIdentityClientId)"
    keyvaultName: "kv-gitops-lab16"
    tenantID: "$(tenantId)"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""