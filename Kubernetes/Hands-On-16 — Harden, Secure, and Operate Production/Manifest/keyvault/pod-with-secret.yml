# ============================================================
# Pod with Azure Key Vault Secret Mounted via CSI Driver
# Demonstrates secrets-store.csi.k8s.io volume type.
#
# The secret is NEVER stored in Kubernetes.
# It lives in Azure Key Vault and is fetched at pod start.
# If Key Vault is unreachable, pod fails to start — by design.
# Rotation: when Key Vault secret rotates, CSI driver
# updates the mounted file automatically (no pod restart).
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: secured-app-pod
  namespace: secured-app
  labels:
    app: secured-app
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: secured-app-sa
  containers:
  - name: app
    image: ACR_PLACEHOLDER
    ports:
    - containerPort: 8000
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets"
      readOnly: true
    env:
    - name: SECRET_PATH
      value: "/mnt/secrets/db-password"
  volumes:
  - name: secrets-store
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "azure-keyvault-secrets"