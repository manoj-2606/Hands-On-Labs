apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: app-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: app
        image: nginx
        ports:
        - containerPort: 80
      - name: exporter
        image: nginx/nginx-prometheus-exporter
        args: ["-nginx.scrape-uri=http://localhost/stub_status"]
        ports:
        - containerPort: 9113
          name: metrics