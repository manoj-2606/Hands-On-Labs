apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-team-a
  namespace: team-a
  labels:
    team: a
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-team-a
  template:
    metadata:
      labels:
        app: app-team-a
        team: a
        env: prod
        version: v1
    spec:
      containers:
        - name: app-team-a
          image: nginx:1.25
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
